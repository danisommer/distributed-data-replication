syntax = "proto3";

package raft;

message Entry {
  int64 index = 1;
  int64 term = 2;
  string key = 3;
  string value = 4;
}

message VoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message VoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message FetchRequest {
  int64 term = 1;
  int32 replica_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message FetchResponse {
  int64 term = 1;
  bool success = 2;
  int32 leader_id = 3;
  repeated Entry entries = 4;
  int64 commit_index = 5;
  bool diverged = 6;
  int64 truncate_to = 7;
}

message WriteRequest {
  string key = 1;
  string value = 2;
}

message WriteResponse {
  bool ok = 1;
  int32 leader_id = 2;
  int64 index = 3;
  string message = 4;
}

message ReadRequest {
  string key = 1;
}

message ReadResponse {
  bool found = 1;
  string value = 2;
}

message StatusRequest {}

message StatusResponse {
  int32 node_id = 1;
  string role = 2;
  int64 term = 3;
  int64 commit_index = 4;
  int64 last_index = 5;
  int32 leader_id = 6;
  int32 voted_for = 7;
  repeated Entry log = 8;
  map<string, string> db = 9;
}

service Raft {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

service Client {
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}
